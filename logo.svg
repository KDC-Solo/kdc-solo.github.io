<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- ghost die (the automated opponent) -->
  <g transform="rotate(14 330 210)">
    <rect x="252" y="128" width="164" height="164" rx="34" fill="none" stroke="#475569" stroke-width="10"/>
    <circle cx="302" cy="178" r="15" fill="#475569"/>
    <circle cx="366" cy="242" r="15" fill="#475569"/>
  </g>
  <!-- solo die: a single pip -->
  <g transform="rotate(-10 220 300)">
    <rect x="118" y="198" width="204" height="204" rx="42" fill="url(#die)"/>
    <circle cx="220" cy="300" r="30" fill="#0f172a"/>
  </g>
</svg>
